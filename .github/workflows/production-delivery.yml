name: Production delivery

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/production-delivery.yml
  workflow_dispatch:
    inputs:
      stage_prebuilt:
        description: Stage and verify a GitHub-built artifact without changing production domains
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-secret-delivery
  cancel-in-progress: false

jobs:
  secrets:
    name: Check committed secrets before production delivery
    uses: ./.github/workflows/secret-scanning.yml

  checks:
    needs: secrets
    name: Test delivery boundaries and wait for CI
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test delivery boundaries without credentials
        run: python3 -m unittest discover -s .github/scripts -p test_production_delivery.py
      - name: Wait for this commit's CI
        run: python3 .github/scripts/production_delivery.py check
        env:
          GH_TOKEN: ${{ github.token }}

  sync:
    name: Sync allowlisted Infisical production keys
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync the pinned production keys
        run: python3 .github/scripts/production_delivery.py sync
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy:
    name: Deploy synced commit after CI succeeds
    needs: sync
    if: github.ref == 'refs/heads/main' && !inputs.stage_prebuilt
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for CI and deploy the exact synced commit
        run: python3 .github/scripts/production_delivery.py deploy
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  stage_prebuilt:
    needs: sync
    if: github.ref == 'refs/heads/main' && inputs.stage_prebuilt
    uses: tsilva/.github/.github/workflows/vercel-prebuilt.yml@22bb600ee7e3b22d238b284c132a3ad64a968719
    with:
      project_id: prj_RWYGMgqwSR27K49CkXMtCwCtH9Pq
      project_name: dedrive
      production_domains: '["dedrive.tsilva.eu","dedrive-web.vercel.app"]'
      public_environment: '["NEXT_PUBLIC_GA_MEASUREMENT_ID","NEXT_PUBLIC_GOOGLE_CLIENT_ID"]'
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
